<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>자양교회 여름수련회 인생네컷</title>
<meta name="theme-color" content="#0080e6" />
<style>
  @font-face {
    font-family: "OkDanDan";
    src: url("assets/fonts/OkDanDan-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "OngeulipUiyeon";
    src: url("assets/fonts/OngeulipUiyeon-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #eaf4ff;
    color: #123a6b;
    font-family: "OngeulipUiyeon", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .wrap.hidden { display: none; }
  h1 {
    font-family: "OkDanDan", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-weight: 800;
    color: #ffffff;
    font-size: clamp(2rem, 9vw, 3rem);
    letter-spacing: 0.12em;
    margin: 0 0 6px;
    text-shadow: 0 8px 16px rgba(18, 58, 107, 0.28), 0 0 18px rgba(63, 197, 255, 0.7);
    animation: title-float 3.6s ease-in-out infinite;
  }
  .subtitle {
    font-family: "OkDanDan", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-weight: 700;
    color: #0080e6;
    font-size: clamp(1rem, 4.2vw, 1.4rem);
    letter-spacing: 0.06em;
    margin: 0 0 20px;
    text-shadow: 0 4px 10px rgba(18, 58, 107, 0.28);
    animation: title-float 3.6s ease-in-out infinite;
    animation-delay: 0.4s;
  }
  @keyframes title-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1, .subtitle { animation: none; }
  }
  .photo-card {
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 8px 28px rgba(0, 60, 120, 0.15);
    margin-bottom: 24px;
  }
  .photo-card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #f1f1f1;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 64px;
    padding: 0 24px;
    background: #0080e6;
    color: #ffffff;
    font-size: 1.15rem;
    font-weight: 700;
    border: none;
    text-decoration: none;
    border-radius: 18px;
    box-shadow: 0 5px 0 #0068bd;
    font-family: "OkDanDan", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #0068bd;
  }
  .btn:disabled {
    opacity: 0.6;
  }
  .hint {
    font-size: 0.9rem;
    color: #4b6f95;
    margin: 16px 0 0;
    line-height: 1.6;
  }
  .brand {
    margin-top: 36px;
    font-size: 0.85rem;
    color: #6a89ac;
  }
  .error {
    max-width: 480px;
    margin: 60px auto 0;
    padding: 0 24px;
    text-align: center;
    color: #7a2340;
    font-size: 1.05rem;
    line-height: 1.7;
  }
  .error.hidden { display: none; }
</style>
</head>
<body>

<div id="wrap" class="wrap">
  <h1>AD FONTES</h1>
  <p class="subtitle">근원으로 돌아가라</p>
  <div class="photo-card">
    <img id="photo" alt="인생네컷 사진" />
  </div>
  <button id="save-btn" type="button" class="btn">사진 앱에 저장하기</button>
  <p id="hint" class="hint">버튼을 누르면 나오는 공유 시트에서<br />"이미지 저장"을 선택하면 사진 앱에 바로 저장됩니다</p>
  <p class="brand">JAYANG YOUTH · 2026.08.13~15</p>
</div>

<div id="error" class="error hidden">
  사진을 불러올 수 없습니다.<br />QR 코드를 다시 스캔해주세요.
</div>

<script>
  function showError() {
    document.getElementById("wrap").classList.add("hidden");
    document.getElementById("error").classList.remove("hidden");
  }

  function canShareFiles() {
    if (!window.navigator || !navigator.canShare || !navigator.share) return false;
    try {
      var probe = new File(["x"], "probe.jpg", { type: "image/jpeg" });
      return navigator.canShare({ files: [probe] });
    } catch (err) {
      return false;
    }
  }

  var params = new URLSearchParams(window.location.search);
  var src = params.get("src");
  var photoUrl = null;

  if (!src) {
    showError();
  } else {
    try {
      var parsed = new URL(src);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") throw new Error("invalid protocol");
      photoUrl = parsed.href;

      var img = document.getElementById("photo");
      img.onerror = showError;
      img.src = photoUrl;
    } catch (err) {
      showError();
    }
  }

  var saveBtn = document.getElementById("save-btn");
  var hintEl = document.getElementById("hint");
  var shareSupported = canShareFiles();

  if (!shareSupported) {
    hintEl.textContent = '사진을 길게 눌러 "사진 앱에 저장" 또는 "이미지 저장"을 선택해주세요';
  }

  saveBtn.addEventListener("click", async function () {
    if (!photoUrl) return;
    if (saveBtn.disabled) return;

    if (!shareSupported) {
      // 공유 시트를 지원하지 않는 기기: 이미지를 새 탭으로 열어 길게 눌러
      // 저장할 수 있게 한다 (iOS/Android 모두 길게 누르면 사진 앱에 저장됨).
      window.open(photoUrl, "_blank");
      return;
    }

    saveBtn.disabled = true;
    var originalText = saveBtn.textContent;
    saveBtn.textContent = "사진을 불러오는 중...";

    try {
      var res = await fetch(photoUrl, { mode: "cors" });
      if (!res.ok) throw new Error("이미지를 불러오지 못했습니다.");
      var blob = await res.blob();
      var file = new File([blob], "jayang-life4cut.jpg", { type: blob.type || "image/jpeg" });

      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        window.open(photoUrl, "_blank");
      }
    } catch (err) {
      // 사용자가 공유 시트를 취소한 경우(AbortError)는 오류가 아니므로 조용히 넘어간다.
      if (!err || err.name !== "AbortError") {
        window.open(photoUrl, "_blank");
      }
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalText;
    }
  });
</script>
</body>
</html>
